[platformio]
default_envs = waveshare_esp32s3_146

[env:waveshare_esp32s3_146]
platform = espressif32 @ 6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions_16MB.csv

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    -Isrc
    -DCORE_DEBUG_LEVEL=1

build_src_flags =
    -Wall
    -Wextra
    -Wshadow
    -Werror

lib_deps =
    lvgl/lvgl @ 8.4.0
    h2zero/NimBLE-Arduino @ 1.4.3

check_tool = cppcheck
check_skip_packages = yes
check_src_filters = +<src/> +<include/>
check_flags =
    cppcheck: --enable=warning,style,performance,portability --inline-suppr --std=c++17 --suppress=*:*libdeps*

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -Werror
    -Isrc
build_src_filter =
    -<*>
